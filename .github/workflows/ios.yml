name: iOS Build & Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app

    - name: Create API key file
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        mkdir -p $HOME/private_keys
        echo "$APP_STORE_CONNECT_API_KEY" > $HOME/private_keys/AuthKey.p8
        ls -l $HOME/private_keys

    - name: Build archive
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      run: |
        xcodebuild \
          -scheme Atlasle \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/Atlasle.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$HOME/private_keys/AuthKey.p8" \
          -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
          -authenticationKeyIssuerID $APP_STORE_CONNECT_API_KEY_ISSUER_ID \
          archive

    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/Atlasle.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      run: |
        xcrun altool --upload-app \
          -f build/Atlasle.ipa \
          -t ios \
          --apiKey $APP_STORE_CONNECT_API_KEY_ID \
          --apiIssuer $APP_STORE_CONNECT_API_KEY_ISSUER_ID
