name: iOS Build & Upload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "16.4"

    - name: Install fastlane
      run: sudo gem install fastlane -N

    - name: Build archive
      run: |
        xcodebuild \
          -scheme Atlasle \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/Atlasle.xcarchive \
          archive

    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/Atlasle.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        echo "$APP_STORE_CONNECT_API_KEY" > AuthKey.p8

        fastlane deliver \
          --api_key_path AuthKey.p8 \
          --api_key_id "$APP_STORE_CONNECT_API_KEY_ID" \
          --api_key_issuer_id "$APP_STORE_CONNECT_API_ISSUER_ID" \
          --ipa build/Atlasle.ipa \
          --skip_screenshots \
          --skip_metadata
