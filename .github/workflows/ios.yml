name: iOS Build & Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app

    - name: Create API key file
      run: |
        echo "$APP_STORE_CONNECT_API_KEY" > AuthKey.p8

    - name: Build archive
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      run: |
        xcodebuild \
          -scheme Atlasle \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/Atlasle.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath AuthKey.p8 \
          -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
          -authenticationKeyIssuerID $APP_STORE_CONNECT_API_KEY_ISSUER_ID \
          archive

    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/Atlasle.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        xcrun altool --upload-app \
          -f build/Atlasle.ipa \
          -t ios \
          --apiKey $APP_STORE_CONNECT_API_KEY_ID \
          --apiIssuer $APP_STORE_CONNECT_API_KEY_ISSUER_ID
